name = "base-token-verdict"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# @x402/hono uses Buffer during settlement
compatibility_flags = ["nodejs_compat"]

[vars]
# Payments: "base-sepolia" (default, x402.org facilitator) or "base" (mainnet; FACILITATOR=payai|dexter)
X402_NETWORK = "base-sepolia"
PAY_TO = "0x741f78ED943C671e25405dAAaAB7b6886C7e8feb"
PRICE_SINGLE = "$0.01"
PRICE_BATCH = "$0.05"
# Free public Base mainnet RPCs (token data always comes from Base mainnet). Comma-separated lists are tried in order.
# publicnode and mainnet.base.org rate-limit Cloudflare's egress IPs, so they come last; LOGS needs a 10k-block eth_getLogs range
# (only publicnode and bloxroute allow that on a free tier).
RPC_URL = "https://base-public.nodies.app,https://base-mainnet.public.blastapi.io,https://base.rpc.blxrbdn.com,https://base-rpc.publicnode.com"
ARCHIVE_RPC_URL = "https://base-public.nodies.app,https://base-mainnet.public.blastapi.io,https://base.rpc.blxrbdn.com,https://base-rpc.publicnode.com,https://mainnet.base.org"
LOGS_RPC_URL = "https://base-rpc.publicnode.com,https://base.rpc.blxrbdn.com"
SIM_USD = "20"
CACHE_TTL_SECONDS = "60"

# Mainnet environment: `npx wrangler deploy --env production`
[env.production.vars]
X402_NETWORK = "base"
FACILITATOR = "payai"
PAY_TO = "0x741f78ED943C671e25405dAAaAB7b6886C7e8feb"
PRICE_SINGLE = "$0.01"
PRICE_BATCH = "$0.05"
RPC_URL = "https://base-public.nodies.app,https://base-mainnet.public.blastapi.io,https://base.rpc.blxrbdn.com,https://base-rpc.publicnode.com"
ARCHIVE_RPC_URL = "https://base-public.nodies.app,https://base-mainnet.public.blastapi.io,https://base.rpc.blxrbdn.com,https://base-rpc.publicnode.com,https://mainnet.base.org"
LOGS_RPC_URL = "https://base-rpc.publicnode.com,https://base.rpc.blxrbdn.com"
SIM_USD = "20"
CACHE_TTL_SECONDS = "60"
