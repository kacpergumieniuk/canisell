# Static landing page for canisell.xyz (Workers static assets). Deploy: npx wrangler deploy
name = "canisell-landing"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "canisell.xyz", custom_domain = true },
  { pattern = "www.canisell.xyz", custom_domain = true },
]

[assets]
directory = "./site"
